# Every push to main: test the sim, build the Windows game with its assets, and publish it as a
# Velopack release on GitHub Releases. Installed copies find it on their next start, download it,
# and install it the start after.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sim -p jsmath --release

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # the field data and CAD models, from the browser game at the commit assets/SOURCE names
      - name: Check out rebuilt-sim-2026 at assets/SOURCE
        shell: bash
        run: |
          git clone -q https://github.com/TylerHandel/rebuilt-sim-2026 _web
          git -C _web checkout -q "$(cat assets/SOURCE)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bring the assets over
        shell: bash
        run: |
          (cd _web && npm ci --no-audit --no-fund)
          (cd tools && npm ci --no-audit --no-fund && npx playwright install chromium)
          node tools/sync-assets.mjs _web
          # the committed data must be what that commit exports
          git add -N assets && git diff --exit-code -- assets/world.json assets/constants.json assets/robots.json assets/parity-engine.json assets/parity-mech.json assets/parity assets/mech

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: echo "VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
      # (the sim's tests here too: its parity with the browser game's engine, on Windows)
      - name: Test
        run: cargo test -p sim -p jsmath --release
      # NVIDIA DLSS (the Upscaler setting): its SDK's headers, libraries and DLL (NVIDIA's license:
      # assets/licenses; the SDK itself is never committed), Vulkan's headers for the bindings, and
      # the runner's LLVM for bindgen
      - name: DLSS SDK and Vulkan headers
        shell: bash
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse -b v310.9.1 https://github.com/NVIDIA/DLSS.git _dlss
          git clone -q --depth 1 -b v1.4.335 https://github.com/KhronosGroup/Vulkan-Headers.git _vk
          # (MSYS_NO_PATHCONV: Git Bash would turn the patterns' leading / into a Windows path)
          MSYS_NO_PATHCONV=1 git -C _dlss sparse-checkout set --no-cone /include /lib/Windows_x86_64/x64 /lib/Windows_x86_64/rel/nvngx_dlss.dll /LICENSE.txt
          test -f _dlss/lib/Windows_x86_64/x64/nvsdk_ngx_d.lib && test -f _dlss/lib/Windows_x86_64/rel/nvngx_dlss.dll && test -f _dlss/include/nvsdk_ngx.h && test -f _dlss/LICENSE.txt
          test -f _vk/include/vulkan/vulkan.h
          echo "DLSS_SDK=$(cygpath -w "$PWD/_dlss")" >> "$GITHUB_ENV"
          echo "VULKAN_SDK=$(cygpath -w "$PWD/_vk")" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo build --release -p app --features dlss

      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rebuilt-sim.exe dist/
          cp -r assets dist/assets
          # (DLSS's DLL beside the game, and NVIDIA's license with its notices)
          cp _dlss/lib/Windows_x86_64/rel/nvngx_dlss.dll dist/
          cp _dlss/LICENSE.txt dist/assets/licenses/NVIDIA-RTX-SDK-LICENSE.txt

      - name: Package and publish (Velopack)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version 1.2.161
          REPO="https://github.com/${{ github.repository }}"
          # the previous release, so this one also ships as a small delta from it
          vpk download github --repoUrl "$REPO" --token "$GH_TOKEN" || true
          vpk pack --packId RebuiltSim --packVersion "$VERSION" --packDir dist --mainExe rebuilt-sim.exe --packTitle "REBUILT Sim"
          vpk upload github --repoUrl "$REPO" --token "$GH_TOKEN" --publish --releaseName "REBUILT Sim $VERSION" --tag "v$VERSION"
